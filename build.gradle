plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'

    // 뮤테이션 테스팅. pit-viper 스킬이 요구하는 두 신호원 중 하나다.
    id 'info.solidsoft.pitest' version '1.19.0'
}

group = 'com'
version = '0.0.1-SNAPSHOT'
description = 'harucut'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// 소스가 UTF-8 인데 javac 은 이걸 모른다 — 안 주면 Gradle 데몬을 띄운 JVM 의
// 기본 charset 을 쓴다. JDK 18 부터는 그게 UTF-8 이지만(JEP 400) 17 이하면
// 한국어 Windows 에서 MS949 라, 같은 소스가 데몬 JVM 에 따라 다르게 컴파일된다.
// 실제로 JDK 17 데몬에서 "unmappable character for encoding x-windows-949" 200 건이
// 나면서 문자열 리터럴의 한글이 깨진 채로 class 에 들어갔다. 빌드는 성공한다 — 그래서 더 나쁘다.
//
// subprojects 가 아니라 allprojects 다. 루트가 서버 모듈이라 여기가 빠지면
// 정작 한글이 가장 많은 곳이 안 덮인다.
allprojects {
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':compose-core')   // 렌더러·스펙 타입 — Lambda와 공유하는 합성 코어
    implementation 'org.springframework.boot:spring-boot-h2console'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'   // 카카오 unlink 아웃바운드 호출용 RestClient.Builder 자동구성
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'   // Boot 4.1 대응 버전. 2.x는 Boot 3 전용이라 여기서는 안 뜬다
    implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
    implementation platform('software.amazon.awssdk:bom:2.25.67')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:lambda'   // LambdaComposeExecutor의 비동기(EVENT) invoke용
    implementation 'software.amazon.awssdk:sqs'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-mail-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // pitest 는 JUnit 4 시절에 만들어졌다. JUnit 5 테스트를 인식시키려면 이 플러그인이 필요하다.
    pitest 'org.pitest:pitest-junit5-plugin:1.2.3'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = '0.8.13'
}

jacocoTestReport {
    dependsOn test

    reports {
        // XML 은 기본으로 꺼져 있다. 스크립트가 읽는 것은 XML 이다.
        xml.required = true
        html.required = true
    }
}

pitest {
    pitestVersion = '1.19.1'
    junit5PluginVersion = '1.2.3'

    // 기본값은 전체다. 실전에서는 스킬의 scope.sh 가 변경 클래스만 넣어 비용을 깎는다:
    //   ./gradlew pitest -PpitScope=$(scope.sh main --pitest)
    targetClasses = findProperty('pitScope')?.toString()?.tokenize(',') ?: ['com.harucut.*']

    // ⚠️ 반드시 명시한다. 안 주면 pitest 가 targetClasses 패턴으로 테스트를 고르기 때문에,
    // 스코프를 좁히는 순간 실행할 테스트가 0개가 되어 전부 NO_COVERAGE 로 나온다.
    targetTests = ['com.harucut.*']

    excludedClasses = ['*.*Config', '*Application', '*.dto.*', '*.entity.*', '*.enums.*',
                       '*.repository.*', '*.controller.*', '*.exception.*']
    excludedMethods = ['toString', 'hashCode', 'equals']
    avoidCallsTo = ['org.slf4j']

    // DEFAULTS 에는 NEGATE_CONDITIONALS 가 없다. 조건 반전은 테스트 구멍의 대표 유형이라 명시한다.
    mutators = ['DEFAULTS', 'NEGATE_CONDITIONALS']

    outputFormats = ['XML', 'HTML']
    timestampedReports = false
    mutationThreshold = 0
}
