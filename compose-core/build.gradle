// 서버(루트)와 Lambda(compose-lambda)가 함께 쓰는 합성 코어 — 렌더러와 스펙 타입.
// 스프링을 모른다: 여기 스프링이 들어오는 순간 Lambda 배포물에도 끌려간다
plugins {
    id 'java-library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 버전은 서버와 같은 Boot BOM으로 맞춘다 — jackson 버전이 어긋나면 직렬화가 미묘하게 달라진다
    api platform('org.springframework.boot:spring-boot-dependencies:4.1.2')
    api 'com.fasterxml.jackson.core:jackson-annotations'   // BackgroundAttributes의 @JsonTypeInfo용

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform {
        // 벤치는 단언이 없고 몇 분씩 걸린다 — CI의 test에 딸려 들어가면 안 된다.
        // @Disabled 가 아니라 태그인 이유: @Disabled 는 "고장나서 꺼둠"과 구분이 안 된다
        excludeTags 'bench'
    }
}

// 측정 전용 태스크 — ./gradlew :compose-core:benchmark
// 기본 힙으로는 모자란다: 4000×6000 ARGB 캔버스 91MB + 평탄화 사본 91MB + PNG 결과 42MB가 겹친다.
// showStandardStreams 없이는 그레이들이 System.out 을 삼켜서 표가 안 보인다
tasks.register('benchmark', Test) {
    description = '결과물 저장 포맷 측정 (docs/perf-10k-dau.md §3.4)'
    group = 'verification'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'bench'
    }

    maxHeapSize = '2g'
    testLogging { showStandardStreams = true }
    outputs.upToDateWhen { false }   // 측정은 캐시하면 안 된다 — 매번 다시 잰다

    ['bench.photos', 'bench.dump'].each { key ->
        if (System.getProperty(key) != null) {
            systemProperty key, System.getProperty(key)
        }
    }
}
