spring:
  datasource:
    # 컨텍스트마다 다른 DB — 같은 이름을 쓰면 캐시에서 밀려난 컨텍스트의 create-drop 이 살아 있는 컨텍스트의 테이블을 지운다
    url: jdbc:h2:mem:harucut-${random.uuid};MODE=MySQL;NON_KEYWORDS=VALUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      # 배치 메타테이블 스크립트를 H2 용으로 교체 (기본은 mysql — application.yaml)
      schema-locations: classpath:org/springframework/batch/core/schema-h2.sql
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
          naver:
            client-id: test-naver-client-id
            client-secret: test-naver-client-secret

jwt:
  secret: local-dev-secret-key-must-be-at-least-256-bits-for-hs256-algorithm-x

cookie:
  secure: false

compose:
  result-consumer:
    # 켜두면 테스트가 실제 SQS 를 긁는다
    enabled: false

cloud:
  aws:
    s3:
      bucket: harucut-test
    lambda:
      # 테스트는 합성을 부르지 않는다. 생성자가 빈 값이면 죽어서 넣는 자리표시자다
      compose-function: test-compose-function
    sqs:
      compose-result-queue-url: ""
storage:
  deletion:
    # 테스트는 재시도 배치를 직접 부른다 — 예약 주기가 테스트 도중 끼어들지 않게 길게
    retry-interval: 3650d
