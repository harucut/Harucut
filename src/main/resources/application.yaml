spring:
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: non_null
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-name: kakao
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - openid
              - account_email
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-name: naver
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - name
              - email
              - profile_image
        provider:
          kakao:
            issuer-uri: https://kauth.kakao.com
            user-name-attribute: sub
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

  batch:
    job:
      enabled: false

  # Flyway — 기본 OFF. 운영 스키마를 V1 기준선에 명시적으로 편입(baseline)하기 전에는 켜지 않는다.
  # 켜는 순간 ddl-auto 도 validate 로 바꿔야 한다 (둘이 동시에 스키마를 고치면 안 된다).
  # baseline-on-migrate 는 쓰지 않는다 — 잘못된 DB 를 조용히 기준선으로 삼는 보호 해제다.
  # docs/adr-0005-flyway-adoption.md
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: false

  # Spring Batch 메타테이블(BATCH_*) 생성. Boot 4는 배치 스키마를 만들어주지 않는다
  # (JDBC 저장소 자체가 옵트인이다 — BatchConfig 참고). 스크립트에 IF NOT EXISTS가 없어
  # 두 번째 기동부터는 오류가 나지만 continue-on-error가 무시한다 — 재기동에 안전하다.
  sql:
    init:
      mode: always
      # DB 종류별 스크립트 — test 프로필은 schema-h2.sql로 통째로 덮어쓰고,
      # 컨테이너(파일 H2)는 SPRING_SQL_INIT_SCHEMA_LOCATIONS 환경변수로 덮어쓴다.
      schema-locations: classpath:org/springframework/batch/core/schema-mysql.sql
      continue-on-error: true

  task:
    scheduling:
      pool:
        size: 4


kakao:
  auth:
    # 탈퇴 배치의 연결 끊기(unlink)에 쓴다. 로그인용 client-secret과 다른 키다.
    admin-key: ${KAKAO_ADMIN_KEY:}

jwt:
  secret: ${JWT_SECRET_KEY}
  access-expiration: 30m
  refresh-expiration: 14d

cookie:
  domain: ${COOKIE_DOMAIN:localhost}
  secure: ${COOKIE_SECURE:true}
  same-site: ${COOKIE_SAME_SITE:Lax}

mail:
  from: ${MAIL_FROM:no-reply@harucut.com}

frontend:
  url: ${FRONTEND_URL:http://localhost:5173}

app:
  oauth2:
    # 앱 로그인(시스템 브라우저)이 끝나면 돌아갈 앱 스킴 — 셸의 app.json scheme. 이 한 곳으로만 돌려보낸다(열린 redirect 없음)
    callback-url: ${APP_OAUTH2_CALLBACK_URL:harucut://oauth2/callback}

cloud:
  aws:
    region: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${S3_BUCKET}
    lambda:
      compose-function: ${COMPOSE_LAMBDA_FUNCTION:}
    sqs:
      compose-result-queue-url: ${COMPOSE_RESULT_QUEUE_URL:}

payment:
  gateway:
    provider: ${PAYMENT_GATEWAY_PROVIDER:mock}
  mock:
    fail-charge: false
    # local/test 밖에서 mock 게이트웨이로 뜨는 것을 허용한다 (MockGatewayGuard 참고).
    # 실제 PG 를 붙이기 전까지만 서버 .env 에서 켠다. 기본은 반드시 false
    allowed-outside-local: ${PAYMENT_MOCK_ALLOWED:false}
  grace-days: ${PAYMENT_GRACE_DAYS:3}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # 엔드포인트가 60개가 넘는다. 다 펼쳐 놓으면 찾기가 더 어렵다.
    doc-expansion: none
    # tags-sorter 를 두지 않는다. OpenApiConfig.tags() 에 적은 순서가 그대로 표시 순서가 된다.
    operations-sorter: method
    display-request-duration: true
    # 처음 열었을 때 선택돼 있을 그룹. 그룹 id(1-user)가 아니라 displayName 으로 찾는다.
    urls-primary-name: 사용자 API
  api-docs:
    path: /v3/api-docs

server:
  shutdown: graceful

# 관측 설정은 부하 프로파일에만 있었다. 그런데 docker-compose.yml 은 이미 관리 포트 8081을
# 전제하고(publish 하지 않음) prometheus.yml 도 app:8081 을 긁는다 — 평소 프로파일로 띄우면
# 그 스크레이프가 조용히 실패했다. 전제와 설정을 같은 자리로 모은다.
management:
  server:
    # API 포트에서 분리한다. 8080 은 외부로 열려 있어서 같은 포트에 두면
    # /actuator/prometheus 로 힙·커넥션·호출 통계가 그대로 노출된다.
    # 8081 은 compose 네트워크 안에서만 닿는다
    port: 8081

  endpoints:
    web:
      exposure:
        # '*' 로 열지 않는다. heapdump 에는 메모리에 있던 JWT 가 그대로 들어있다
        include: health,prometheus,metrics

  # 무중단 배포·로드밸런서용 프로브 (ADR-0009 §7-3). 배포 스크립트가 보는 /actuator/health 는 그대로(DB·Redis 전부).
  # - liveness(/actuator/health/liveness): 앱 자체 상태만 — 외부 의존이 잠깐 끊겼다고 재시작시키지 않는다
  # - readiness(/actuator/health/readiness): DB 까지. Redis 는 넣지 않는다 — 리프레시 토큰·이메일 인증·빈도 제한(fail-open)에만 쓰고
  #   행사 참가·부스·합성·사진함은 Redis 없이 돈다. 모든 인스턴스가 같은 Redis 를 보므로 넣으면 잠깐 끊길 때 전 인스턴스가 함께 빠진다
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

  metrics:
    tags:
      application: harucut
      # 인스턴스를 늘리면 두 인스턴스의 숫자가 한 덩어리로 섞인다 — compose 에서 다른 값을 준다
      instance: ${INSTANCE_ID:app-1}

compose:
  stale-after: 10m
