# PR 게이트. main·develop 으로 들어오는 PR 마다 전체 테스트와 실제 MySQL 시험을 돌린다.
#
# 머지 후(deploy.yml)에는 테스트를 다시 돌리지 않는다 — 그래야 배포가 빠르다.
# 그 대신 "여기서 테스트한 코드 = 머지되는 코드"를 브랜치 보호로 보장해야 한다:
#   Settings → Branches → main → Require status checks to pass (이 워크플로의 test)
#                              + Require branches to be up to date before merging
# 이 두 개를 안 켜면, 옛 main 기준으로 통과한 PR 이 머지되면서 한 번도 테스트 안 된 조합이 배포된다.
name: CI

on:
  pull_request:
    branches: [main, develop]

# 같은 PR 에 새 커밋이 오면 앞선 실행은 버린다 — 옛 커밋의 결과는 쓸모가 없다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # 의존성·빌드 캐시. PR 에서는 캐시를 읽기만 하고, 쓰기는 main 에서만 한다(기본 동작)
      - uses: gradle/actions/setup-gradle@v5

      # 단위(Mockito)·슬라이스(@WebMvcTest/@DataJpaTest)·통합(@SpringBootTest)을 한 번에 돈다.
      # 나누면 병렬로 빨라지지만 테스트마다 태그를 붙여 관리해야 한다 — CI 시간이 거슬릴 때 나눈다
      - name: Run tests
        run: ./gradlew test --no-daemon

      # H2 로는 입증하지 못하는 것 — V1~ 전체를 MySQL 에 적용해 Hibernate validate 로 대조하고 잠금·경합을 실제로 돌린다.
      # Testcontainers 가 쓰는 Docker 는 러너에 있다
      - name: Run MySQL tests
        run: ./gradlew mysqlTest --no-daemon

      # 실패했을 때만 리포트를 올린다. 로그만으로는 어느 단언이 깨졌는지 찾기 어렵다
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-report
          path: |
            build/reports/tests/test
            build/reports/tests/mysqlTest
          retention-days: 7
